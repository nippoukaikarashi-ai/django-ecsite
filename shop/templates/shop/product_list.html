<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>商品一覧</title>
    <style>
        body { font-family: sans-serif; }
        h1 { border-bottom: 2px solid #007bff; padding-bottom: 10px; font-size: 50px;}
        .product-item { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .product-item h2 { margin-top: 0; font-size: 40px;}
        a {text-decoration: none; color: black;}
    </style>
</head>
<body>
    <h1>top</h1>
    <p><a href="{% url 'shop:cart_detail' %}">in cart</a></p>
    {% for product in products %}
        <div class="product-item">
            <h2>
                <a href="{% url 'shop:product_detail' product.pk %}">{{ product.name }}</a>
            </h2>
            <p>price: &yen;{{product.price | floatformat:"0, g" }}</p>
            <p>{{ product.description }}</p>
        </div>
    {% empty %}
        <p>現在販売中の商品はありません。</p>
    {% endfor %}
</body>
</html>
